name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html sw.js manifest.webmanifest www/
          cp icon-*.png www/
      - run: npm install
      - run: npx cap add android
      - name: Set app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          CMD=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            $CMD icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            $CMD icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
          done
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zad-almuslim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
