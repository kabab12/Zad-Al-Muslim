name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [full, basic]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build ${{ matrix.variant }}
        run: bash zad-build.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: zad-${{ matrix.variant }}-apk
          path: out/zad-${{ matrix.variant }}.apk
